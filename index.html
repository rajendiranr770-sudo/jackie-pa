<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>என் நிதி நிர்வாகம்</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-24">

    <!-- Auth Container -->
    <div id="auth-container" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-4 text-slate-800">வரவேற்கிறோம்!</h2>
            <p class="text-slate-600 mb-6">உங்கள் கணக்குகளை நிர்வகிக்க உள்நுழையவும்</p>
            <button id="login-btn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">
                Google மூலம் உள்நுழைக
            </button>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden max-w-md mx-auto p-4">
        
        <!-- Header -->
        <div class="bg-slate-900 text-white p-4 rounded-2xl flex justify-between items-center mb-4 shadow-md">
            <div>
                <span class="text-sm text-slate-400 block">வரவேற்கிறோம்,</span>
                <span id="user-display-name" class="font-bold">பயனர்</span>
            </div>
            <button id="logout-btn" class="bg-red-500/20 text-red-300 text-xs px-3 py-2 rounded-lg font-bold hover:bg-red-500/30">
                லாக்அவுட்
            </button>
        </div>

        <!-- Print Container for PDF -->
        <div id="pdf-printable-area">
            
            <div id="pdf-header-title" class="hidden text-center text-xl font-bold mb-4 text-slate-900">
                நிதி அறிக்கை (Finance Report)
            </div>

            <!-- Dashboard Cards -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                    <div class="text-xs text-slate-500 font-semibold">சம்பளம்</div>
                    <div id="salary-val" class="text-lg font-extrabold text-slate-800">₹0</div>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                    <div class="text-xs text-slate-500 font-semibold">வீடு</div>
                    <div id="home-val" class="text-lg font-extrabold text-slate-800">₹0</div>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                    <div class="text-xs text-slate-500 font-semibold">கொல்லை</div>
                    <div id="kollai-val" class="text-lg font-extrabold text-slate-800">₹0</div>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                    <div class="text-xs text-slate-500 font-semibold">MK செலவு</div>
                    <div id="mk-val" class="text-lg font-extrabold text-slate-800">₹0</div>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                    <div class="text-xs text-slate-500 font-semibold">SK செலவு</div>
                    <div id="sk-val" class="text-lg font-extrabold text-slate-800">₹0</div>
                </div>
                <div class="bg-blue-50 p-3 rounded-xl shadow-sm border border-blue-200">
                    <div class="text-xs text-blue-600 font-semibold">வட்டி பிசினஸ்</div>
                    <div id="vatti-val" class="text-lg font-extrabold text-blue-700">₹0</div>
                </div>
            </div>

            <!-- Month Filter & PDF Button Row -->
            <div class="flex gap-2 mb-4">
                <select id="month-filter-select" class="flex-1 bg-white border border-slate-300 text-slate-700 rounded-xl p-2.5 font-semibold text-sm focus:outline-none shadow-sm">
                    <option value="ALL">எல்லா மாதங்களும் (All)</option>
                </select>
                <button onclick="downloadFilteredPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-sm flex items-center gap-1 transition">
                    📄 PDF
                </button>
            </div>

            <!-- Search Section -->
            <div class="bg-sky-50 p-4 rounded-2xl border border-sky-200 mb-4 shadow-sm">
                <h3 class="font-bold text-sky-900 mb-2 flex items-center gap-2">
                    🔍 செலவு கணக்கு கேட்க / தேட
                </h3>
                <div class="flex gap-2">
                    <input type="text" id="search-query-input" placeholder="எ.கா: சிகரெட், MK செலவு..." class="flex-1 p-3 rounded-xl border border-sky-300 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm shadow-inner">
                    <button onclick="processSearch()" class="bg-sky-600 text-white px-4 py-3 rounded-xl font-bold text-sm hover:bg-sky-700 transition">
                        தேடு
                    </button>
                </div>

                <!-- Dynamic Search Total Popup/Box (நீங்க கேட்ட பிரத்யேக டோட்டல் பாக்ஸ்) -->
                <div id="search-result-box" class="mt-3 hidden"></div>
            </div>

            <!-- All Transactions List -->
            <div class="mb-4">
                <h3 class="font-bold text-slate-700 mb-2 text-base">அனைத்துப் பதிவுகள்</h3>
                <div id="all-list" class="space-y-2"></div>
            </div>

        </div> <!-- End of PDF Area -->

    </div>

    <!-- Bottom Input Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 shadow-lg z-40">
        <div class="max-w-md mx-auto flex gap-2">
            <input type="text" id="voice-text-input" placeholder="எ.கா: எம் கே செலவு 50" class="flex-1 bg-slate-100 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none">
            <button onclick="processVoiceOrText()" class="bg-blue-600 text-white font-bold px-4 py-3 rounded-xl text-sm hover:bg-blue-700 transition">
                அனுப்பு
            </button>
            <button onclick="startVoiceRecognition()" class="bg-emerald-600 text-white font-bold px-4 py-3 rounded-xl text-sm hover:bg-emerald-700 transition flex items-center gap-1">
                🎙️ பேசு
            </button>
        </div>
    </div>

    <!-- Source Selection Modal -->
    <div id="sourceModal" class="modal">
        <div class="bg-white p-6 rounded-2xl max-w-xs w-full text-center shadow-2xl">
            <h3 class="font-bold text-slate-800 text-lg mb-2">பண ஆதாரம் தேர்வு செய்யவும்</h3>
            <p id="sourceModalText" class="text-sm text-slate-500 mb-4"></p>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="confirmSource('சம்பளம்')" class="bg-blue-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-blue-700">💼 சம்பளம்</button>
                <button onclick="confirmSource('வீடு')" class="bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-emerald-700">🏠 வீடு</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
