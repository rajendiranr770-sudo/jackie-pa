<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AUTH CONTAINER -->
    <div id="auth-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <h2>நிதி நிர்வாக செயலி</h2>
        <button id="login-btn" class="btn-primary">Google மூலம் உள்நுழைக</button>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" style="display: none;">
        <!-- HEADER -->
        <header style="display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #1e293b; color: white;">
            <span style="font-size: 15px; font-weight: bold;">வரவேற்கிறோம், <b id="user-display-name">RUBA ABI</b></span>
            <button id="logout-btn" style="background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">லாக்அவுட்</button>
        </header>

        <!-- DASHBOARD CARDS -->
        <div class="dashboard-grid">
            <div class="card" onclick="switchTab('salary-tab', document.querySelectorAll('.tab-btn')[0])">
                <h3>சம்பளம்</h3>
                <p id="salary-val">₹0</p>
            </div>
            <div class="card" onclick="switchTab('home-tab', document.querySelectorAll('.tab-btn')[1])">
                <h3>வீடு</h3>
                <p id="home-val">₹0</p>
            </div>
            <div class="card" onclick="switchTab('kollai-tab', document.querySelectorAll('.tab-btn')[2])">
                <h3>கொல்லை</h3>
                <p id="kollai-val">₹0</p>
            </div>
            <div class="card" onclick="switchTab('mk-tab', document.querySelectorAll('.tab-btn')[3])">
                <h3>MK செலவு</h3>
                <p id="mk-val">₹0</p>
            </div>
            <div class="card" onclick="switchTab('sk-tab', document.querySelectorAll('.tab-btn')[4])">
                <h3>SK செலவு</h3>
                <p id="sk-val">₹0</p>
            </div>
            <div class="card" onclick="switchTab('vatti-tab', document.querySelectorAll('.tab-btn')[5])">
                <h3>வட்டி பிசினஸ்</h3>
                <p id="vatti-val">₹0</p>
            </div>
        </div>

        <!-- TABS NAVIGATION -->
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('salary-tab', this)">💼 சம்பளம்</button>
            <button class="tab-btn" onclick="switchTab('home-tab', this)">🏡 வீடு</button>
            <button class="tab-btn" onclick="switchTab('kollai-tab', this)">🌱 கொல்லை</button>
            <button class="tab-btn" onclick="switchTab('mk-tab', this)">🛍️ MK</button>
            <button class="tab-btn" onclick="switchTab('sk-tab', this)">🛒 SK</button>
            <button class="tab-btn" onclick="switchTab('vatti-tab', this)">💰 வட்டி</button>
            <button class="tab-btn" onclick="switchTab('ai-tab', this)">📋 அனைத்தும்</button>
        </div>

        <!-- TAB CONTENTS -->
        <div style="padding: 10px 15px;">
            <!-- AI ALL LIST -->
            <div id="ai-tab" class="tab-content">
                <div id="ai-list"></div>
            </div>

            <!-- SALARY TAB -->
            <div id="salary-tab" class="tab-content active">
                <div class="form-card">
                    <h4 style="margin: 0 0 8px 0;">சம்பள வரவு / செலவு சேர்க்க</h4>
                    <input type="text" id="sal-desc" placeholder="விவரம்">
                    <div class="form-row">
                        <input type="number" id="sal-amt" class="flex-1" placeholder="தொகை">
                        <select id="sal-type">
                            <option value="income">வரவு (+)</option>
                            <option value="expense">செலவு (-)</option>
                        </select>
                        <button onclick="addManualEntry('சம்பளம்', 'sal-desc', 'sal-amt', 'sal-type')" class="btn-primary">சேர்</button>
                    </div>
                </div>
                <div id="salary-list"></div>
            </div>

            <!-- HOME TAB -->
            <div id="home-tab" class="tab-content">
                <div class="form-card">
                    <h4 style="margin: 0 0 8px 0;">வீட்டு வரவு / செலவு சேர்க்க</h4>
                    <input type="text" id="home-desc" placeholder="விவரம்">
                    <div class="form-row">
                        <input type="number" id="home-amt" class="flex-1" placeholder="தொகை">
                        <select id="home-type">
                            <option value="income">வரவு (+)</option>
                            <option value="expense">செலவு (-)</option>
                        </select>
                        <button onclick="addManualEntry('வீடு', 'home-desc', 'home-amt', 'home-type')" class="btn-primary">சேர்</button>
                    </div>
                </div>
                <div id="home-list"></div>
            </div>

            <!-- KOLLAI TAB -->
            <div id="kollai-tab" class="tab-content">
                <div class="form-card">
                    <h4 style="margin: 0 0 8px 0;">கொல்லை செலவு சேர்க்க</h4>
                    <input type="text" id="kollai-desc" placeholder="விவரம் (மருந்து/உரம்)">
                    <div class="form-row">
                        <input type="number" id="kollai-amt" class="flex-1" placeholder="தொகை">
                        <select id="kollai-source">
                            <option value="சம்பளம்">சம்பளம்</option>
                            <option value="வீடு">வீடு</option>
                        </select>
                        <button onclick="addExpenseManual('கொல்லை', 'kollai-desc', 'kollai-amt', 'kollai-source')" class="btn-primary">சேர்</button>
                    </div>
                </div>
                <div id="kollai-list"></div>
            </div>

            <!-- MK TAB -->
            <div id="mk-tab" class="tab-content">
                <div class="form-card">
                    <h4 style="margin: 0 0 8px 0;">MK செலவு சேர்க்க</h4>
                    <input type="text" id="mk-desc" placeholder="விவரம்">
                    <div class="form-row">
                        <input type="number" id="mk-amt" class="flex-1" placeholder="தொகை">
                        <select id="mk-source">
                            <option value="சம்பளம்">சம்பளம்</option>
                            <option value="வீடு">வீடு</option>
                        </select>
                        <button onclick="addExpenseManual('MK செலவு', 'mk-desc', 'mk-amt', 'mk-source')" class="btn-primary">சேர்</button>
                    </div>
                </div>
                <div id="mk-list"></div>
            </div>

            <!-- SK TAB -->
            <div id="sk-tab" class="tab-content">
                <div class="form-card">
                    <h4 style="margin: 0 0 8px 0;">SK செலவு சேர்க்க</h4>
                    <input type="text" id="sk-desc" placeholder="விவரம்">
                    <div class="form-row">
                        <input type="number" id="sk-amt" class="flex-1" placeholder="தொகை">
                        <select id="sk-source">
                            <option value="சம்பளம்">சம்பளம்</option>
                            <option value="வீடு">வீடு</option>
                        </select>
                        <button onclick="addExpenseManual('SK செலவு', 'sk-desc', 'sk-amt', 'sk-source')" class="btn-primary">சேர்</button>
                    </div>
                </div>
                <div id="sk-list"></div>
            </div>

            <!-- VATTI TAB -->
            <div id="vatti-tab" class="tab-content">
                <div id="vatti-form-box" class="form-card">
                    <h4 style="margin: 0 0 8px 0;">வட்டி கடன் பதிவிட</h4>
                    <input type="text" id="vatti-name" placeholder="நபர் பெயர்" style="margin-bottom: 8px;">
                    <div id="vatti-inputs-container">
                        <div class="form-row" style="margin-top:0; margin-bottom: 8px;">
                            <input type="number" class="vatti-amt-input flex-1" placeholder="அசல் தொகை (₹)">
                            <input type="number" class="vatti-rate-input flex-1" placeholder="வட்டி % / பைசா">
                        </div>
                    </div>
                    <div class="form-row" style="margin-top:0; margin-bottom: 8px;">
                        <input type="date" id="vatti-date-input" class="flex-1">
                        <button onclick="addMoreLoanField()" style="background: #64748b; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer;">+ கடன் சேர்</button>
                    </div>
                    <button onclick="saveVattiAccount()" style="width: 100%; background: #16a34a;" class="btn-primary">சேமி</button>
                </div>
                <div id="vatti-person-list"></div>
            </div>
        </div>

        <!-- FIXED AI BOTTOM INPUT BAR -->
        <div class="bottom-input-bar">
            <input type="text" id="userInput" placeholder="எ.கா: பால் 50">
            <button onclick="handleManualInput()" style="background: #2563eb;">அனுப்பு</button>
            <button onclick="startVoiceRecognition()" style="background: #16a34a;">🎙️ பேசு</button>
        </div>
    </div>

    <!-- MODALS -->
    <div id="sourceModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:9999;">
        <div style="background:#fff; padding:20px; border-radius:10px; text-align:center; max-width:300px; width:90%;">
            <p id="sourceModalText" style="margin-bottom:15px; font-weight:bold;"></p>
            <div style="display:flex; justify-content:space-around;">
                <button onclick="confirmSource('சம்பளம்')" class="btn-primary">சம்பளம்</button>
                <button onclick="confirmSource('வீடு')" style="background:#16a34a;" class="btn-primary">வீடு</button>
            </div>
        </div>
    </div>

    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:9999;">
        <div style="background:#fff; padding:20px; border-radius:10px; width:90%; max-width:350px;">
            <h3>திருத்தம் செய்க</h3>
            <input type="text" id="edit-text" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <input type="number" id="edit-amount" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <input type="date" id="edit-date" style="width:100%; padding:8px; margin-bottom:15px; box-sizing:border-box;">
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button onclick="closeEditModal()" style="background:#64748b; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">ரத்து</button>
                <button onclick="saveEdit()" class="btn-primary">சேமி</button>
            </div>
        </div>
    </div>

    <div id="vattiEditModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:9999;">
        <div style="background:#fff; padding:20px; border-radius:10px; width:90%; max-width:350px;">
            <h3>வட்டி கடன் திருத்தம்</h3>
            <label style="font-size:12px;">அசல் தொகை:</label>
            <input type="number" id="edit-vatti-amt" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <label style="font-size:12px;">வட்டி %:</label>
            <input type="number" id="edit-vatti-rate" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <label style="font-size:12px;">தேதி:</label>
            <input type="date" id="edit-vatti-date" style="width:100%; padding:8px; margin-bottom:15px; box-sizing:border-box;">
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button onclick="closeVattiEditModal()" style="background:#64748b; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">ரத்து</button>
                <button onclick="saveVattiEdit()" class="btn-primary">சேமி</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
