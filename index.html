<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Loan Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Dashboard -->
    <section class="dashboard-dark">
        <div class="grid-card"><span class="card-title">சம்பளம்</span><span class="card-value" id="salary-val">₹0</span></div>
        <div class="grid-card"><span class="card-title">வீடு</span><span class="card-value" id="home-val">₹0</span></div>
        <div class="grid-card"><span class="card-title">கொல்லை செலவு</span><span class="card-value" id="kollai-val">₹0</span></div>
        <div class="grid-card"><span class="card-title">MK செலவு</span><span class="card-value" id="mk-val">₹0</span></div>
        <div class="grid-card"><span class="card-title">SK செலவு</span><span class="card-value" id="sk-val">₹0</span></div>
        <div class="grid-card"><span class="card-title">வட்டி பிசினஸ்</span><span class="card-value" id="vatti-val">₹0</span></div>
    </section>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('ai-tab', this)">🤖 AI சாட்</button>
        <button class="tab-btn" onclick="switchTab('salary-tab', this)">💼 சம்பளம்</button>
        <button class="tab-btn" onclick="switchTab('home-tab', this)">🏠 வீடு</button>
        <button class="tab-btn" onclick="switchTab('kollai-tab', this)">🌱 கொல்லை</button>
        <button class="tab-btn" onclick="switchTab('mk-tab', this)">🛍️ MK</button>
        <button class="tab-btn" onclick="switchTab('sk-tab', this)">🛒 SK</button>
        <button class="tab-btn" onclick="switchTab('vatti-tab', this)">💰 வட்டி கணக்கு</button>
    </div>

    <main class="content-area">
        <!-- AI Chat Tab -->
        <section id="ai-tab" class="tab-content active">
            <div id="ai-list"></div>
        </section>

        <!-- Salary Tab -->
        <section id="salary-tab" class="tab-content">
            <div class="card-form-box">
                <h3>💼 மேனுவல் பதிவு (SALARY)</h3>
                <input type="text" id="salary-desc" placeholder="விவரம் அல்லது பெயர்">
                <input type="number" id="salary-amt" placeholder="தொகை (₹)">
                <select id="salary-type">
                    <option value="income">வரவு (+)</option>
                    <option value="expense">செலவு (-)</option>
                </select>
                <input type="datetime-local" id="salary-date">
                <button class="btn-primary" onclick="addManualEntry('சம்பளம்', 'salary-desc', 'salary-amt', 'salary-type', 'salary-date')">சேர்</button>
            </div>
            <div id="salary-list"></div>
        </section>

        <!-- Home Tab -->
        <section id="home-tab" class="tab-content">
            <div class="card-form-box">
                <h3>🏠 மேனுவல் பதிவு (HOME)</h3>
                <input type="text" id="home-desc" placeholder="விவரம் அல்லது பெயர்">
                <input type="number" id="home-amt" placeholder="தொகை (₹)">
                <select id="home-type">
                    <option value="income">வரவு (+)</option>
                    <option value="expense">செலவு (-)</option>
                </select>
                <input type="datetime-local" id="home-date">
                <button class="btn-primary" onclick="addManualEntry('வீடு', 'home-desc', 'home-amt', 'home-type', 'home-date')">சேர்</button>
            </div>
            <div id="home-list"></div>
        </section>

        <!-- Kollai Tab -->
        <section id="kollai-tab" class="tab-content">
            <div class="card-form-box">
                <h3>🌱 மேனுவல் பதிவு (KOLLAI)</h3>
                <input type="text" id="kollai-desc" placeholder="விவரம் அல்லது பெயர்">
                <input type="number" id="kollai-amt" placeholder="தொகை (₹)">
                <select id="kollai-source">
                    <option value="வீடு">வீட்டு பணம்</option>
                    <option value="சம்பளம்">சம்பள பணம்</option>
                </select>
                <input type="datetime-local" id="kollai-date">
                <button class="btn-primary" onclick="addExpenseManual('கொல்லை', 'kollai-desc', 'kollai-amt', 'kollai-source', 'kollai-date')">சேர்</button>
            </div>
            <div id="kollai-list"></div>
        </section>

        <!-- MK Tab -->
        <section id="mk-tab" class="tab-content">
            <div class="card-form-box">
                <h3>🛍️ மேனுவல் பதிவு (MK)</h3>
                <input type="text" id="mk-desc" placeholder="விவரம் அல்லது பெயர்">
                <input type="number" id="mk-amt" placeholder="தொகை (₹)">
                <select id="mk-source">
                    <option value="வீடு">வீட்டு பணம்</option>
                    <option value="சம்பளம்">சம்பள பணம்</option>
                </select>
                <input type="datetime-local" id="mk-date">
                <button class="btn-primary" onclick="addExpenseManual('MK செலவு', 'mk-desc', 'mk-amt', 'mk-source', 'mk-date')">சேர்</button>
            </div>
            <div id="mk-list"></div>
        </section>

        <!-- SK Tab -->
        <section id="sk-tab" class="tab-content">
            <div class="card-form-box">
                <h3>🛒 மேனுவல் பதிவு (SK)</h3>
                <input type="text" id="sk-desc" placeholder="விவரம் அல்லது பெயர்">
                <input type="number" id="sk-amt" placeholder="தொகை (₹)">
                <select id="sk-source">
                    <option value="வீடு">வீட்டு பணம்</option>
                    <option value="சம்பளம்">சம்பள பணம்</option>
                </select>
                <input type="datetime-local" id="sk-date">
                <button class="btn-primary" onclick="addExpenseManual('SK செலவு', 'sk-desc', 'sk-amt', 'sk-source', 'sk-date')">சேர்</button>
            </div>
            <div id="sk-list"></div>
        </section>

        <!-- Vatti Tab -->
        <section id="vatti-tab" class="tab-content">
            <div class="card-form-box">
                <h3>💰 வட்டி கடன் சேர்க்க</h3>
                <input type="text" id="vatti-name" placeholder="நபர் பெயர் (எ.கா: சேகர்)">
                <div id="loans-container">
                    <div class="loan-input-row">
                        <input type="number" class="vatti-amount" placeholder="அசல் தொகை (₹)">
                        <input type="number" class="vatti-rate" placeholder="வட்டி % (மாதம்)">
                        <input type="datetime-local" class="vatti-date">
                    </div>
                </div>
                <button class="btn-secondary" onclick="addLoanInputRow()">➕ கூடுதல் கடன் சேர்க்க</button>
                <button class="btn-primary" onclick="saveVattiAccount()">சேமி</button>
            </div>
            <div id="vatti-person-list"></div>
        </section>
    </main>

    <!-- Bottom Chat Input Bar -->
    <div class="bottom-chat-bar">
        <input type="text" id="userInput" placeholder="எ.கா: எம்கே செலவு 500...">
        <button class="btn-send" onclick="handleManualInput()">அனுப்பு</button>
        <button class="btn-voice" onclick="startVoiceRecognition()">🎙️ பேசு</button>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>பதிவை எடிட் செய்ய</h3>
            <label>விவரம்:</label>
            <input type="text" id="edit-text">
            <label>தொகை:</label>
            <input type="number" id="edit-amount">
            <div class="modal-actions">
                <button onclick="saveEdit()" class="btn-primary">சேமி</button>
                <button onclick="closeEditModal()" class="btn-cancel">ரத்து</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
