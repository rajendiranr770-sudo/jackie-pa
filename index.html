<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ஜோக்கி கணக்கு</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. AI Chat Section -->
  <div id="sec-ai" class="section active">
    <h2>🎙️ AI உதவி மற்றும் குரல் பதிவு</h2>
    <div id="chatBox" class="chat-box">
      <div class="msg bot">வணக்கம் பாலாஜி சார்! என்ன கணக்கு பதிவு செய்ய வேண்டும்?</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="எ.கா: சம்பளத்தில் 400 பெட்ரோல்">
      <div style="display: flex; gap: 6px; margin-top: 8px;">
        <button onclick="sendMsg()" class="btn btn-blue" style="flex:1;">அனுப்பு</button>
        <button onclick="startVoice()" class="btn btn-green" style="flex:1;">🎤 பேசு</button>
        <button onclick="deleteLastEntry()" class="btn" style="flex:1; background-color: #f59e0b; color: white;">↩️ நீக்கு</button>
        <button onclick="clearChat()" class="btn btn-red" style="flex:1;">அழி</button>
      </div>
      <p id="status" style="font-size:12px; color:gray; text-align:center; margin-top:4px;">🎤 தயார்</p>
    </div>
  </div>

  <!-- 2. Salary Section -->
  <div id="sec-salary" class="section">
    <h2>💼 சம்பளப் பண கணக்கு</h2>
    <div class="card">
      <h3>மீதி இருப்பு: ₹<span id="bal-salary">0</span></h3>
    </div>
    <div id="hist-salary" class="history-box"></div>
  </div>

  <!-- 3. Home Section -->
  <div id="sec-home" class="section">
    <h2>🏠 வீட்டுப் பண கணக்கு</h2>
    <div class="card">
      <h3>மீதி இருப்பு: ₹<span id="bal-home">0</span></h3>
    </div>
    <div id="hist-home" class="history-box"></div>
  </div>

  <!-- 4. Kollai Section -->
  <div id="sec-kollai" class="section">
    <h2>🌱 கொல்லை செலவு கணக்கு</h2>
    <div class="card">
      <h3 style="color:red;">மொத்த செலவு: ₹<span id="total-kollai">0</span></h3>
    </div>
    <div id="hist-kollai" class="history-box"></div>
  </div>

  <!-- 5. Vatti Section -->
  <div id="sec-vatti" class="section">
    <h2>💰 வட்டி கணக்கு</h2>
    <div id="vattiList"></div>
  </div>

  <!-- 6. Notes Section -->
  <div id="sec-notes" class="section">
    <h2>📝 நினைவூட்டல் குறிப்புகள்</h2>
    <div id="hist-notes" class="history-box"></div>
  </div>

  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <button class="nav-btn active" onclick="showSec('sec-ai', this)">🤖<br>AI</button>
    <button class="nav-btn" onclick="showSec('sec-salary', this)">💼<br>சம்பளம்</button>
    <button class="nav-btn" onclick="showSec('sec-home', this)">🏠<br>வீடு</button>
    <button class="nav-btn" onclick="showSec('sec-kollai', this)">🌱<br>கொல்லை</button>
    <button class="nav-btn" onclick="showSec('sec-vatti', this)">💰<br>வட்டி</button>
    <button class="nav-btn" onclick="showSec('sec-notes', this)">📝<br>குறிப்பு</button>
  </nav>

  <script src="app.js"></script>
</body>
  </html>
