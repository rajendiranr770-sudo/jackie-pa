<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ஜோக்கி - Smart PA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding-bottom: 70px; }
    header { background-color: #1a365d; color: white; text-align: center; padding: 15px; font-size: 1.2rem; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .container { padding: 15px; max-width: 600px; margin: 0 auto; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
    h2 { color: #2b6cb0; font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .chat-box { height: 300px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; background: #f8fafc; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .bot { background: #e2e8f0; color: #2d3748; align-self: flex-start; border-bottom-left-radius: 2px; }
    .user { background: #3182ce; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .input-group { display: flex; gap: 8px; margin-top: 5px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.95rem; outline: none; }
    button { padding: 10px 15px; border: none; border-radius: 6px; background-color: #3182ce; color: white; font-weight: bold; cursor: pointer; }
    button.mic { background-color: #38a169; }
    button.clear { background-color: #e53e3e; }
    
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e2e8f0; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: #718096; text-decoration: none; cursor: pointer; }
    .nav-item.active { color: #3182ce; font-weight: bold; }
    
    .section { display: none; }
    .section.active { display: block; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e2e8f0; }
    th { background-color: #edf2f7; color: #4a5568; }
    .amount-in { color: #38a169; font-weight: bold; }
    .amount-out { color: #e53e3e; font-weight: bold; }
  </style>
</head>
<body>

  <header>🤖 ஜோக்கி - Smart PA</header>

  <div class="container">
    
    <!-- AI CHAT SECTION -->
    <div id="sec-ai" class="section active">
      <div class="card">
        <h2>🎙️ AI உதவி மற்றும் குரல் பதிவு</h2>
        <div id="status" style="font-size: 0.8rem; color: #718096; margin-bottom: 5px;">🎤 தயார்</div>
        <div class="chat-box" id="chatBox">
          <div class="msg bot">வணக்கம் பாலாஜி சார்! என்ன உதவி செய்ய வேண்டும்?</div>
        </div>
        <div class="input-group">
          <input type="text" id="userInput" placeholder="உதாரணம்: சம்பளம் 20000 வந்தது...">
        </div>
        <div class="input-group" style="margin-top: 8px;">
          <button onclick="sendMsg()" style="flex: 1;">அனுப்பு</button>
          <button class="mic" onclick="startVoice()" style="flex: 1;">🎤 பேசு</button>
          <button class="clear" onclick="clearChat()">அழி</button>
        </div>
      </div>
    </div>

    <!-- INCOME SECTION -->
    <div id="sec-income" class="section">
      <div class="card">
        <h2>💼 வரவு கணக்கு (Income)</h2>
        <table>
          <thead>
            <tr><th>விவரம்</th><th>தொகை (₹)</th><th>தேதி</th></tr>
          </thead>
          <tbody id="incomeTable"></tbody>
        </table>
      </div>
    </div>

    <!-- EXPENSE SECTION -->
    <div id="sec-expense" class="section">
      <div class="card">
        <h2>💸 செலவு கணக்கு (Expenses)</h2>
        <table>
          <thead>
            <tr><th>விவரம்</th><th>தொகை (₹)</th><th>தேதி</th></tr>
          </thead>
          <tbody id="expenseTable"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- NAVIGATION -->
  <div class="nav-bar">
    <div class="nav-item active" onclick="showSec('sec-ai', this)">🤖 AI</div>
    <div class="nav-item" onclick="showSec('sec-income', this)">💼 வரவு</div>
    <div class="nav-item" onclick="showSec('sec-expense', this)">💸 செலவு</div>
  </div>

  <script>
    let db = JSON.parse(localStorage.getItem('jackie_db')) || { income: [], expense: [] };

    function saveData() {
      localStorage.setItem('jackie_db', JSON.stringify(db));
      renderData();
    }

    function renderData() {
      const incT = document.getElementById('incomeTable');
      const expT = document.getElementById('expenseTable');
      
      incT.innerHTML = db.income.map(i => `<tr><td>${i.desc}</td><td class="amount-in">₹${i.amt}</td><td>${i.date}</td></tr>`).join('');
      expT.innerHTML = db.expense.map(e => `<tr><td>${e.desc}</td><td class="amount-out">₹${e.amt}</td><td>${e.date}</td></tr>`).join('');
    }

    function showSec(id, el) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      el.classList.add('active');
    }

    function addChat(text, isUser) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `msg ${isUser ? 'user' : 'bot'}`;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function sendMsg() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addChat(text, true);
      input.value = '';
      processNLP(text);
    }

    function processNLP(text) {
      const cleanText = text.replace(/,/g, '');
      const numMatch = cleanText.match(/\d+/);

      if (!numMatch) {
        addChat('மன்னிக்கவும் பாலாஜி சார், தொகையை (எண்) சரியாகக் குறிப்பிடவும்.', false);
        return;
      }

      const amt = parseInt(numMatch[0]);
      const date = new Date().toLocaleDateString('ta-IN');

      // வரவுக்கான முக்கிய வார்த்தைகள் (Keywords for Income)
      const incomeKeywords = ['வந்தது', 'கொடுத்தார்கள்', 'அனுப்பினார்கள்', 'கிடைத்தது', 'சேர்ந்தது', 'வரவு', 'சம்பளம்', 'பணம் வந்தது'];
      
      let isIncome = false;
      for (let word of incomeKeywords) {
        if (cleanText.includes(word)) {
          isIncome = true;
          break;
        }
      }

      // விவரத்தைக் கண்டறிதல் (Extract Description)
      let desc = cleanText
        .replace(numMatch[0], '')
        .replace(/(வந்தது|கொடுத்தார்கள்|அனுப்பினார்கள்|கிடைத்தது|சேர்ந்தது|வரவு|ரூபாய்|ரூ|ஆயிரம்)/g, '')
        .trim();

      if (!desc) desc = isIncome ? 'வரவு' : 'செலவு';

      if (isIncome) {
        db.income.push({ desc, amt, date });
        saveData();
        addChat(`சரி பாலாஜி சார், ₹${amt} [${desc}] வரவு கணக்கில் சேர்க்கப்பட்டது! ✅`, false);
      } else {
        db.expense.push({ desc, amt, date });
        saveData();
        addChat(`சரி பாலாஜி சார், ₹${amt} [${desc}] செலவு கணக்கில் பதிவு செய்யப்பட்டது! 💸`, false);
      }
    }

    function clearChat() {
      document.getElementById('chatBox').innerHTML = '<div class="msg bot">வணக்கம் பாலாஜி சார்! என்ன உதவி செய்ய வேண்டும்?</div>';
    }

    // Voice Recognition
    function startVoice() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) {
        alert('உங்கள் உலாவியில் குரல் பதிவு வசதி இல்லை.');
        return;
      }
      const rec = new Speech();
      rec.lang = 'ta-IN';
      
      document.getElementById('status').innerText = '🎤 கேட்கிறது... பேசுங்கள்...';
      rec.start();

      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById('userInput').value = text;
        document.getElementById('status').innerText = '🎤 தயார்';
        sendMsg();
      };

      rec.onerror = () => {
        document.getElementById('status').innerText = '🎤 மீண்டும் முயற்சிக்கவும்';
      };
    }

    renderData();
  </script>
</body>
</html>
