<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ஜோக்கி - Smart PA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding-bottom: 70px; }
    header { background-color: #1a365d; color: white; text-align: center; padding: 15px; font-size: 1.2rem; font-weight: bold; position: sticky; top: 0; z-index: 100; }
    .container { padding: 15px; max-width: 600px; margin: 0 auto; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
    h2 { color: #2b6cb0; font-size: 1.1rem; margin-bottom: 12px; }
    
    .chat-box { height: 280px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; background: #f8fafc; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
    .bot { background: #e2e8f0; color: #2d3748; align-self: flex-start; }
    .user { background: #3182ce; color: white; align-self: flex-end; }
    
    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; }
    button { padding: 10px 15px; border: none; border-radius: 6px; background-color: #3182ce; color: white; font-weight: bold; cursor: pointer; }
    button.mic { background-color: #38a169; }
    button.clear { background-color: #e53e3e; }
    
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e2e8f0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.8rem; color: #718096; cursor: pointer; }
    .nav-item.active { color: #3182ce; font-weight: bold; }
    
    .section { display: none; }
    .section.active { display: block; }
    
    .history-item { padding: 8px; border-bottom: 1px solid #edf2f7; display: flex; justify-content: space-between; font-size: 0.9rem; }
    .in { color: #38a169; font-weight: bold; }
    .out { color: #e53e3e; font-weight: bold; }
    .minus { color: #e53e3e; }
  </style>
</head>
<body>

  <header>🤖 ஜோக்கி - Smart PA</header>

  <div class="container">
    
    <!-- AI CHAT -->
    <div id="sec-ai" class="section active">
      <div class="card">
        <h2>🎙️ AI உதவி மற்றும் குரல் பதிவு</h2>
        <div id="status" style="font-size: 0.8rem; color: #718096; margin-bottom: 5px;">🎤 தயார்</div>
        <div class="chat-box" id="chatBox">
          <div class="msg bot">வணக்கம் பாலாஜி சார்! என்ன கணக்கு பதிவு செய்ய வேண்டும்?</div>
        </div>
        <div class="input-group">
          <input type="text" id="userInput" placeholder="எ.கா: கொல்லைக்கு மருந்து 500">
        </div>
        <div class="input-group" style="margin-top: 8px;">
          <button onclick="sendMsg()" style="flex: 1;">அனுப்பு</button>
          <button class="mic" onclick="startVoice()" style="flex: 1;">🎤 பேசு</button>
          <button class="clear" onclick="clearChat()">அழி</button>
        </div>
      </div>
    </div>

    <!-- SAMBALAM -->
    <div id="sec-salary" class="section">
      <div class="card">
        <h2>💼 சம்பளக் கணக்கு</h2>
        <h3>மீதித் தொகை: ₹<span id="bal-salary">0</span></h3>
        <div id="hist-salary" style="margin-top: 10px;"></div>
      </div>
    </div>

    <!-- VEEDU -->
    <div id="sec-home" class="section">
      <div class="card">
        <h2>🏠 வீட்டுக் கணக்கு</h2>
        <h3>மீதித் தொகை: ₹<span id="bal-home">0</span></h3>
        <div id="hist-home" style="margin-top: 10px;"></div>
      </div>
    </div>

  </div>

  <!-- NAVIGATION -->
  <div class="nav-bar">
    <div class="nav-item active" onclick="showSec('sec-ai', this)">🤖 AI</div>
    <div class="nav-item" onclick="showSec('sec-salary', this)">💼 சம்பளம்</div>
    <div class="nav-item" onclick="showSec('sec-home', this)">🏠 வீடு</div>
  </div>

  <script>
    let db = JSON.parse(localStorage.getItem('jackie_pa_v2')) || { salary: [], home: [] };
    let pendingExpense = null; // நிலுவையில் உள்ள செலவைச் சேமிக்க

    function saveData() {
      localStorage.setItem('jackie_pa_v2', JSON.stringify(db));
      renderData();
    }

    function renderData() {
      // Salary Balance
      let salBal = db.salary.reduce((acc, item) => item.type === 'in' ? acc + item.amt : acc - item.amt, 0);
      const salElem = document.getElementById('bal-salary');
      salElem.innerText = salBal;
      salElem.className = salBal < 0 ? 'minus' : '';

      document.getElementById('hist-salary').innerHTML = db.salary.map(i => 
        `<div class="history-item"><span>${i.desc}</span><span class="${i.type}">₹${i.amt}</span></div>`
      ).join('');

      // Home Balance
      let homeBal = db.home.reduce((acc, item) => item.type === 'in' ? acc + item.amt : acc - item.amt, 0);
      const homeElem = document.getElementById('bal-home');
      homeElem.innerText = homeBal;
      homeElem.className = homeBal < 0 ? 'minus' : '';

      document.getElementById('hist-home').innerHTML = db.home.map(i => 
        `<div class="history-item"><span>${i.desc}</span><span class="${i.type}">₹${i.amt}</span></div>`
      ).join('');
    }

    function showSec(id, el) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      el.classList.add('active');
    }

    function addChat(text, isUser) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `msg ${isUser ? 'user' : 'bot'}`;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function sendMsg() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addChat(text, true);
      input.value = '';
      processNLP(text);
    }

    function processNLP(text) {
      const cleanText = text.replace(/,/g, '');
      const date = new Date().toLocaleDateString('ta-IN');

      // 1. நிலுவையில் செலவு கேட்டுக்கொண்டிருக்கும் போது பதில் அளித்தால்
      if (pendingExpense) {
        if (cleanText.includes('சம்பளம்') || cleanText.includes('சம்பள')) {
          db.salary.push({ desc: pendingExpense.desc, amt: pendingExpense.amt, type: 'out', date });
          saveData();
          addChat(`சரி பாலாஜி சார்! ₹${pendingExpense.amt} [${pendingExpense.desc}] சம்பளக் கணக்கில் செலவாகப் பதிவு செய்யப்பட்டது. 💼`, false);
          pendingExpense = null;
          return;
        } else if (cleanText.includes('வீடு') || cleanText.includes('வீட்டு')) {
          db.home.push({ desc: pendingExpense.desc, amt: pendingExpense.amt, type: 'out', date });
          saveData();
          addChat(`சரி பாலாஜி சார்! ₹${pendingExpense.amt} [${pendingExpense.desc}] வீட்டுக் கணக்கில் செலவாகப் பதிவு செய்யப்பட்டது. 🏠`, false);
          pendingExpense = null;
          return;
        }
      }

      // 2. புதிய பதிவு
      const numMatch = cleanText.match(/\d+/);
      if (!numMatch) {
        addChat('மன்னிக்கவும் பாலாஜி சார், தொகையை (எண்) சரியாகக் குறிப்பிடவும்.', false);
        return;
      }

      const amt = parseInt(numMatch[0]);
      const isIncome = /(வந்தது|கொடுத்தார்கள்|அனுப்பினார்கள்|கிடைத்தது|சேர்ந்தது|வரவு)/.test(cleanText);

      // வரவு பதிவுகள்
      if (isIncome) {
        if (cleanText.includes('வீடு') || cleanText.includes('வீட்டில்') || cleanText.includes('வீட்டிலிருந்து')) {
          db.home.push({ desc: cleanText, amt, type: 'in', date });
          saveData();
          addChat(`சரி பாலாஜி சார், ₹${amt} வீட்டுக் கணக்கில் வரவாகச் சேர்க்கப்பட்டது! 🏠`, false);
        } else {
          db.salary.push({ desc: cleanText, amt, type: 'in', date });
          saveData();
          addChat(`சரி பாலாஜி சார், ₹${amt} சம்பளக் கணக்கில் வரவாகச் சேர்க்கப்பட்டது! 💼`, false);
        }
      } 
      // செலவு பதிவுகள் (AI கேள்வி கேட்கும் பகுதி)
      else {
        // நேரடியாக சம்பளம்/வீடு என்று சொல்லியிருந்தால்
        if (cleanText.includes('சம்பளம்')) {
          db.salary.push({ desc: cleanText, amt, type: 'out', date });
          saveData();
          addChat(`சரி பாலாஜி சார், ₹${amt} சம்பளக் கணக்கில் செலவாகப் பதிவு செய்யப்பட்டது. 💼`, false);
        } else if (cleanText.includes('வீடு')) {
          db.home.push({ desc: cleanText, amt, type: 'out', date });
          saveData();
          addChat(`சரி பாலாஜி சார், ₹${amt} வீட்டுக் கணக்கில் செலவாகப் பதிவு செய்யப்பட்டது. 🏠`, false);
        } else {
          // எங்குச் செலவு செய்வது என்று கேட்கும்
          pendingExpense = { desc: cleanText, amt };
          addChat(`பாலாஜி சார், ₹${amt} (${cleanText}) செலவை "சம்பளப் பணம்"-இல் கழிக்கவா அல்லது "வீட்டுப் பணம்"-இல் கழிக்கவா?`, false);
        }
      }
    }

    function clearChat() {
      pendingExpense = null;
      document.getElementById('chatBox').innerHTML = '<div class="msg bot">வணக்கம் பாலாஜி சார்! என்ன கணக்கு பதிவு செய்ய வேண்டும்?</div>';
    }

    function startVoice() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) { alert('குரல் பதிவு வசதி இல்லை.'); return; }
      const rec = new Speech();
      rec.lang = 'ta-IN';
      document.getElementById('status').innerText = '🎤 கேட்கிறது... பேசுங்கள்...';
      rec.start();

      rec.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        document.getElementById('status').innerText = '🎤 தயார்';
        sendMsg();
      };
    }

    renderData();
  </script>
</body>
</html>
