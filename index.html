<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- Top Dark Theme Overview Grid -->
    <section class="dashboard-dark">
        <div class="grid-card">
            <span class="card-title">சம்பளம்</span>
            <span class="card-value" id="salary-val">₹0</span>
        </div>
        <div class="grid-card">
            <span class="card-title">வீடு</span>
            <span class="card-value" id="home-val">₹0</span>
        </div>
        <div class="grid-card">
            <span class="card-title">கொல்லை</span>
            <span class="card-value" id="kollai-val">₹0</span>
        </div>
        <div class="grid-card">
            <span class="card-title">MK செலவு</span>
            <span class="card-value" id="mk-val">₹0</span>
        </div>
        <div class="grid-card">
            <span class="card-title">SK செலவு</span>
            <span class="card-value" id="sk-val">₹0</span>
        </div>
        <div class="grid-card">
            <span class="card-title">வட்டி</span>
            <span class="card-value" id="vatti-val">₹0</span>
        </div>
    </section>

    <!-- Navigation Scroll Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('ai-tab', this)">🤖 AI சாட்</button>
        <button class="tab-btn" onclick="switchTab('salary-tab', this)">💼 சம்பளம்</button>
        <button class="tab-btn" onclick="switchTab('home-tab', this)">🏠 வீடு</button>
        <button class="tab-btn" onclick="switchTab('kollai-tab', this)">🌱 கொல்லை</button>
        <button class="tab-btn" onclick="switchTab('mk-tab', this)">🛍️ MK செலவு</button>
        <button class="tab-btn" onclick="switchTab('sk-tab', this)">🛒 SK செலவு</button>
        <button class="tab-btn" onclick="switchTab('vatti-tab', this)">💰 வட்டி</button>
    </div>

    <!-- Main Content Tab Views -->
    <main class="content-area">
        <section id="ai-tab" class="tab-content active">
            <div id="ai-list" class="transaction-list"></div>
        </section>

        <section id="salary-tab" class="tab-content">
            <div id="salary-list" class="transaction-list"></div>
        </section>

        <section id="home-tab" class="tab-content">
            <div id="home-list" class="transaction-list"></div>
        </section>

        <section id="kollai-tab" class="tab-content">
            <div id="kollai-list" class="transaction-list"></div>
        </section>

        <section id="mk-tab" class="tab-content">
            <div id="mk-list" class="transaction-list"></div>
        </section>

        <section id="sk-tab" class="tab-content">
            <div id="sk-list" class="transaction-list"></div>
        </section>

        <section id="vatti-tab" class="tab-content">
            <div id="vatti-list" class="transaction-list"></div>
        </section>
    </main>

    <!-- Bottom AI Chat Input Bar -->
    <div class="bottom-chat-bar">
        <input type="text" id="userInput" placeholder="எ.கா: சம்பளம் 20000 அல்லது MK செலவு 500...">
        <button class="btn-send" onclick="handleManualInput()">அனுப்பு</button>
        <button class="btn-voice" onclick="startVoiceRecognition()">🎙️ பேசு</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
