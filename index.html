<head>

    <style>

        .manual-entry-box {
    background: white;
    padding: 15px;

}

.submit-btn {

    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;

    font-weight: bold;

        .person-card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #cbd5e1; }
        .person-header { font-size: 16px; font-weight: bold; color: #1e3a8a; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index: 1000; }
        .modal-box { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; text-align: center; }

        .send-btn { background: #2563eb; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; }
        .mic-btn { background: #10b981; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; }

</head>

            <button class="tab-btn" data-tab="கொல்லை" onclick="filterTab('கொல்லை', this)">🌱 கொல்லை</button>
            <button class="tab-btn" data-tab="MK செலவு" onclick="filterTab('MK செலவு', this)">👤 MK</button>
            <button class="tab-btn" data-tab="SK செலவு" onclick="filterTab('SK செலவு', this)">👤 SK</button>
            <button class="tab-btn" data-tab="வட்டி பிசினஸ்" onclick="filterTab('வட்டி பிசினஸ்', this)">💰 வட்டி</button>

        <!-- Search Bar -->
        <div class="search-box" id="search-box-area">
            <div class="search-title">🔍 செலவு கணக்கு கேட்க / தேட</div>
            <div class="search-input-group">
                <input type="text" id="search-input" class="search-input" placeholder="தேடவும் (எ.கா: சிகரெட், 20000)">
                <button class="search-btn" onclick="renderApp()">தேடு</button>

            <!-- மேனுவல் என்ட்ரி ஃபார்ம் -->
    <div class="manual-entry-box" id="manual-form-container" style="display: none;">

        <!-- Section 1: Standard View -->
        <div id="standard-view">
            <div class="section-title" id="list-title">அனைத்துப் பதிவுகள்</div>
            <div id="tx-list-container"></div>
        </div>

        <!-- Section 2: Vatti View -->
        <div id="vatti-view" style="display: none;">
            <div class="vatti-form">
                <div class="section-title">💰 வட்டி கடன் பதிவிட</div>
                <input type="text" id="v-name" class="form-input" placeholder="நபர் பெயர் (எ.கா: சுரேஷ்)" style="width:100%; margin-bottom:8px;">
                <div class="form-row">
                    <input type="number" id="v-principal" class="form-input" placeholder="அசல் தொகை (₹)">

        <!-- Section 3: Kai-Maathu View -->
        <div id="kaimaathu-view" style="display: none;">
            <div class="vatti-form">
                <div class="section-title">🤝 கைமாத்து கடன் பதிவிட (0% வட்டி)</div>
                <input type="text" id="km-name" class="form-input" placeholder="நபர் பெயர்" style="width:100%; margin-bottom:8px;">
                <input type="number" id="km-amount" class="form-input" placeholder="தொகை (₹)" style="width:100%; margin-bottom:8px;">
                <button class="btn-green" onclick="triggerKaiMaathuAdd()">+ கைமாத்து சேர்</button>

    <!-- Popup Modal -->
    <div class="modal-overlay" id="source-modal">
        <div class="modal-box">
            <h3 id="modal-title" style="margin-bottom:12px;">பணம் எதிலிருந்து எடுக்கப்பட்டது?</h3>
            <button class="modal-btn" style="background:#2563eb; color:white;" onclick="resolveSource('சம்பளம்')">சம்பள பணம்</button>
            <button class="modal-btn" style="background:#16a34a; color:white;" onclick="resolveSource('வீடு')">வீட்டு பணம்</button>
        </div>
    </div>

    <!-- Fixed Bottom Bar -->
    <div class="bottom-bar">
        <input type="text" id="voice-text-input" class="voice-input" placeholder="எ.கா: எம் கே செலவு 500">
        <button id="btn-send-tx" class="send-btn">அனுப்பு</button>
        <button id="btn-mic" class="mic-btn">🎙️ பேசு</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXRVuNCiWh1AhuVHInbKcfUAmgyAwzVHk",
            authDomain: "myfinanceapp-3f883.firebaseapp.com",
            projectId: "myfinanceapp-3f883",
            storageBucket: "myfinanceapp-3f883.firebasestorage.app",
            messagingSenderId: "698658153791",
            appId: "1:698658153791:web:08ea0171d24a9b0da51f8a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let allTransactions = [];
        let allVattiLoans = [];
        let activeTab = "All";
        let pendingAction = null;

        document.getElementById("login-btn").onclick = () => signInWithRedirect(auth, provider);
        document.getElementById("logout-btn").onclick = () => signOut(auth);
        document.getElementById("btn-send-tx").onclick = processInput;
        document.getElementById("btn-mic").onclick = startVoice;

        getRedirectResult(auth).catch(err => console.error(err));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("auth-container").style.display = "none";
                document.getElementById("main-app").style.display = "block";
                document.getElementById("user-display-name").innerText = user.displayName || "User";
                listenToData(user.uid);
            } else {
                document.getElementById("auth-container").style.display = "block";
                document.getElementById("main-app").style.display = "none";
            }
        });

        // ---------------- Number Extracting Fix ----------------
         function extractAmount(text) {
    // 1. முதல்ல கமா இருந்தா எடுத்துடுவோம் (எ.கா: 20,000 -> 20000)
    let textVal = text.replace(/,/g, '');

    // 2. முழு வார்த்தைகளை முதல்ல மாத்திடுவோம்
    textVal = textVal.replace(/அறுபதாயிரம்/g, "60000")
                     .replace(/இருபதாயிரம்/g, "20000")
                     .replace(/ஐயாயிரம்/g, "5000")
                     .replace(/இரண்டாயிரம்/g, "2000");

    // 3. இதுதான் முக்கியம்: "20 ஆயிரம்" அல்லது "20ஆயிரம்" என்று இருந்தால் 
    // அதை நம்பரா மாத்தி 1000-ஆல பெருக்கி 20000 என்று மாத்திடும்
    textVal = textVal.replace(/(\d+)\s*ஆயிரம்/gi, (match, number) => {
        return parseInt(number) * 1000;
    });

    // 4. கடைசியா நம்பரை மட்டும் தேடும்
    let matches = textVal.match(/\d+/g);
    if (!matches) return 0;
    
    // எல்லாத்தையும் ஜாயின் பண்ணி நம்பரா தந்துடும்
    return parseInt(matches.join(''), 10);
}

        function processInput() {
            const inputField = document.getElementById("voice-text-input");
            let rawText = inputField.value.trim();
            if (!rawText) return;

            let amount = extractAmount(rawText);
            let lowerText = rawText.toLowerCase();
            let isIncome = lowerText.includes("வரவு") || 
               lowerText.includes("வந்தது") || 
               lowerText.includes("தந்தாங்க") || 
               lowerText.includes("தந்தான்") || 
               lowerText.includes("தந்தாரு") || 
               lowerText.includes("கொடுத்தாங்க") || 
               lowerText.includes("கொடுத்தான்") || 
               lowerText.includes("கொடுத்தாரு");

            let category = "பொது";
            if (lowerText.includes("mk") || lowerText.includes("எம் கே")) category = "MK செலவு";
            else if (lowerText.includes("sk") || lowerText.includes("எஸ் கே")) category = "SK செலவு";
            else if (lowerText.includes("கொல்லை")) category = "கொல்லை";
            else if (lowerText.includes("கைமாத்து")) category = "கைமாத்து";
            else if (lowerText.includes("வட்டி")) category = "வட்டி பிசினஸ்";

            let txData = {
                title: rawText,
                amount: amount,
                type: isIncome ? "income" : "expense",
                category: category,
                timestamp: Date.now()
            };

            if (isIncome || category === "SK செலவு" || category === "கைமாத்து") {
                pendingAction = { type: "TX", data: txData };
                document.getElementById("modal-title").innerText = "பணம் எதிலிருந்து/எங்கு சேர வேண்டும்?";
                document.getElementById("source-modal").style.display = "flex";
            } else {
                txData.source = "சம்பளம்";
                saveTransaction(txData);
            }

            inputField.value = "";
        }

        window.triggerKaiMaathuAdd = function() {
            let name = document.getElementById("km-name").value.trim();
            let amt = parseInt(document.getElementById("km-amount").value);
            if (!name || !amt) { alert("விவரங்களை நிரப்பவும்!"); return; }

            pendingAction = {
                type: "KM",
                data: { personName: name, principal: amt, rate: 0, timestamp: Date.now(), isReturned: false, isKaiMaathu: true }
            };
            document.getElementById("modal-title").innerText = "கைமாத்து பணம் எதிலிருந்து கொடுக்கப்பட்டது?";
            document.getElementById("source-modal").style.display = "flex";
        };

        window.resolveSource = function(selectedSource) {
            document.getElementById("source-modal").style.display = "none";
            if (!pendingAction) return;

            if (pendingAction.type === "TX") {
                pendingAction.data.source = selectedSource;
                saveTransaction(pendingAction.data);
            } else if (pendingAction.type === "KM") {
                pendingAction.data.source = selectedSource;
                addDoc(collection(db, "users", auth.currentUser.uid, "vatti"), pendingAction.data);
                
                // Add expense transaction for chosen source
                saveTransaction({
                    title: `${pendingAction.data.personName}-க்கு கைமாத்து கொடுத்தது`,
                    amount: pendingAction.data.principal,
                    type: "expense",
                    source: selectedSource,
                    category: "கைமாத்து",
                    timestamp: Date.now()
                });
                
                document.getElementById("km-name").value = "";
                document.getElementById("km-amount").value = "";
            }
            pendingAction = null;
        };

        function saveTransaction(txData) {
            addDoc(collection(db, "users", auth.currentUser.uid, "transactions"), txData);
        }

        function listenToData(uid) {
            onSnapshot(query(collection(db, "users", uid, "transactions"), orderBy("timestamp", "desc")), (snap) => {
                allTransactions = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateCalculations();
            });

            onSnapshot(query(collection(db, "users", uid, "vatti"), orderBy("timestamp", "desc")), (snap) => {
                allVattiLoans = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateCalculations();
            });
        }

        function updateCalculations() {
            let totals = { "சம்பளம்": 0, "வீடு": 0, "கொல்லை": 0, "MK செலவு": 0, "SK செலவு": 0, "வட்டி பிசினஸ்": 0 };

            allTransactions.forEach(tx => {
                if (tx.type === "income") {
                    totals[tx.source] = (totals[tx.source] || 0) + tx.amount;
                } else {
                    totals[tx.source] = (totals[tx.source] || 0) - tx.amount;
                    if (tx.category && tx.category !== "பொது") {
                        totals[tx.category] = (totals[tx.category] || 0) + tx.amount;
                    }
                }
            });

            let vattiTotal = 0;
            allVattiLoans.forEach(v => {
                if (!v.isReturned && !v.isKaiMaathu) vattiTotal += v.principal;
            });
            totals["வட்டி பிசினஸ்"] = vattiTotal;

            document.getElementById("val-salary").innerText = `₹${totals["சம்பளம்"]}`;
            document.getElementById("val-home").innerText = `₹${totals["வீடு"]}`;
            document.getElementById("val-kollai").innerText = `₹${totals["கொல்லை"]}`;
            document.getElementById("val-mk").innerText = `₹${totals["MK செலவு"]}`;
            document.getElementById("val-sk").innerText = `₹${totals["SK செலவு"]}`;
            document.getElementById("val-vatti").innerText = `₹${totals["வட்டி பிசினஸ்"]}`;

            renderApp();
        }

        // Fast Navigation with Smooth Scroll
        window.selectTab = function(tabName) {
            let targetBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
            if (targetBtn) {
                filterTab(tabName, targetBtn);
                document.getElementById("search-box-area").scrollIntoView({ behavior: 'smooth' });
            }
        };

        window.filterTab = function(tabName, btnElem) {
            activeTab = tabName;
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btnElem.classList.add("active");

            document.getElementById("standard-view").style.display = "none";
            document.getElementById("vatti-view").style.display = "none";
            document.getElementById("kaimaathu-view").style.display = "none";

            if (tabName === "வட்டி பிசினஸ்") {
                document.getElementById("vatti-view").style.display = "block";
            } else if (tabName === "கைமாத்து") {
                document.getElementById("kaimaathu-view").style.display = "block";
            } else {
                document.getElementById("standard-view").style.display = "block";
            }
            renderApp();
        };

        function renderApp() {
            if (activeTab === "வட்டி பிசினஸ்") renderVattiView();
            else if (activeTab === "கைமாத்து") renderKaiMaathuView();
            else renderStandardView();
        }

        function renderStandardView() {
            const container = document.getElementById("tx-list-container");
            const searchKeyword = document.getElementById("search-input").value.toLowerCase().trim();

            let filtered = allTransactions.filter(tx => {
                let matchesTab = (activeTab === "All") || (tx.source === activeTab) || (tx.category === activeTab);
                let matchesSearch = !searchKeyword || tx.title.toLowerCase().includes(searchKeyword);
                return matchesTab && matchesSearch;
            });

            container.innerHTML = "";
            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:gray;">பதிவுகள் எதுவும் இல்லை.</div>`;
                return;
            }

            filtered.forEach(tx => {
                let dateStr = new Date(tx.timestamp).toLocaleDateString("ta-IN");
                let div = document.createElement("div");
                div.className = `tx-card ${tx.type}`;
                div.innerHTML = `
                    <div>
                        <div class="tx-title">${tx.title}</div>
                        <div class="tx-sub">${dateStr} | கணக்கு: <b>${tx.source}</b></div>
                    </div>
                    <div class="tx-amt" style="color: ${tx.type === 'income' ? '#10b981' : '#ef4444'}">
                        ${tx.type === 'income' ? '+' : '-'}₹${tx.amount}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.addVattiLoan = function() {
            let name = document.getElementById("v-name").value.trim();
            let principal = parseInt(document.getElementById("v-principal").value);
            let rate = parseFloat(document.getElementById("v-rate").value) || 0;
            if (!name || !principal) { alert("விவரங்களை நிரப்பவும்!"); return; }

            addDoc(collection(db, "users", auth.currentUser.uid, "vatti"), {
                personName: name, principal: principal, rate: rate, timestamp: Date.now(), isReturned: false, isKaiMaathu: false
            });

            document.getElementById("v-name").value = "";
            document.getElementById("v-principal").value = "";
            document.getElementById("v-rate").value = "";
        };

        function renderVattiView() {
            const container = document.getElementById("vatti-persons-container");
            container.innerHTML = "";
            let loansList = allVattiLoans.filter(v => !v.isKaiMaathu);

            loansList.forEach((l, i) => {
                let days = Math.floor((Date.now() - l.timestamp) / (1000 * 60 * 60 * 24));
                let interest = Math.round((l.principal * (l.rate / 100) * (days / 30)));
                let div = document.createElement("div");
                div.className = "person-card";
                div.innerHTML = `
                    <div class="person-header">
                        <span>👤 ${l.personName}</span>
                        <input type="checkbox" ${l.isReturned ? 'checked' : ''} onchange="toggleLoanReturn('${l.id}', this.checked, false)">
                    </div>
                    <div>அசல்: ₹${l.principal} | வட்டி: ${l.rate}%</div>
                    <div style="color:#d97706; font-weight:bold; margin-top:4px;">வட்டி தொகை: ₹${interest} (${days} நாட்கள்)</div>
                `;
                container.appendChild(div);
            });
        }

        function renderKaiMaathuView() {
            const container = document.getElementById("kaimaathu-container");
            container.innerHTML = "";
            let kmList = allVattiLoans.filter(v => v.isKaiMaathu);

            kmList.forEach(l => {
                let div = document.createElement("div");
                div.className = "person-card";
                div.innerHTML = `
                    <div class="person-header">
                        <span>🤝 ${l.personName}</span>
                        <input type="checkbox" ${l.isReturned ? 'checked' : ''} onchange="toggleLoanReturn('${l.id}', this.checked, true, '${l.source}', ${l.principal}, '${l.personName}')">
                    </div>
                    <div>கைமாத்து தொகை: <b>₹${l.principal}</b></div>
                    <div style="font-size:12px; color:gray; margin-top:4px;">எடுக்கப்பட்ட கணக்கு: <b>${l.source}</b></div>
                `;
                container.appendChild(div);
            });
        }

        window.toggleLoanReturn = function(loanId, isChecked, isKaiMaathu, source, amount, name) {
            updateDoc(doc(db, "users", auth.currentUser.uid, "vatti", loanId), { isReturned: isChecked });
            if (isKaiMaathu && isChecked) {
                // Add money back to original source when checked
                saveTransaction({
                    title: `${name}-டமிருந்து கைமாத்து திரும்ப வந்தது`,
                    amount: amount,
                    type: "income",
                    source: source,
                    category: "கைமாத்து",
                    timestamp: Date.now()
                });
            }
        };

function saveManualEntry() {
    let title = document.getElementById("manual-title").value.trim();
    let amount = parseFloat(document.getElementById("manual-amount").value);
    let type = document.getElementById("manual-type").value;

    if (!title || isNaN(amount) || amount <= 0) {
        alert("தயவுசெய்து சரியான விவரம் மற்றும் தொகையை உள்ளிடவும்!");
        return;
    }

    let txData = {
        title: title,
        amount: amount,
        type: type,
        category: currentCategory,
        source: "மேனுவல் பதிவு",
        timestamp: Date.now()
    };

    saveTransaction(txData);

    document.getElementById("manual-title").value = "";
    document.getElementById("manual-amount").value = "";
}
