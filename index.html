<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Finance & Loan Master App</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --panel-alt: #e0f2fe;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      padding: 12px 12px 88px;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
    }

    .header {
      background: #0f172a;
      color: white;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.08rem;
    }

    .header small {
      display: block;
      opacity: 0.8;
      margin-top: 3px;
      font-size: 0.76rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .button {
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .button:hover { transform: translateY(-1px); }
    .button:active { transform: translateY(0); }
    .button.primary { background: var(--primary); color: white; }
    .button.success { background: var(--success); color: white; }
    .button.warning { background: var(--warning); color: #1f2937; }
    .button.danger { background: var(--danger); color: white; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .stat-card .label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
    }

    .stat-card .value {
      margin-top: 5px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
    }

    .stat-card.income .value { color: #15803d; }
    .stat-card.expense .value { color: #b91c1c; }
    .stat-card.balance .value { color: #1d4ed8; }

    .search-panel {
      background: var(--panel-alt);
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .search-panel h2,
    .panel h2 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr 0.9fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      padding: 10px 12px;
      color: var(--text);
    }

    .summary-box {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .summary-item {
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-weight: 800;
      border: 1px solid transparent;
    }

    .summary-income { background: #dcfce7; color: #166534; border-color: #86efac; }
    .summary-expense { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .summary-balance { background: #f1f5f9; color: var(--text); border-color: var(--border); }

    .form-grid {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr 0.9fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .full-width { width: 100%; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 12px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .transaction {
      display: grid;
      grid-template-columns: 1.3fr 0.8fr 0.6fr;
      gap: 10px;
      align-items: center;
      background: white;
      border: 1px solid var(--border);
      border-left: 5px solid #94a3b8;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .transaction.income { border-left-color: #10b981; }
    .transaction.expense { border-left-color: #ef4444; }

    .transaction .meta {
      min-width: 0;
    }

    .transaction .title {
      font-weight: 800;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .transaction .subtitle {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .transaction .amount {
      font-weight: 800;
      font-size: 1rem;
      text-align: right;
    }

    .transaction.income .amount { color: #15803d; }
    .transaction.expense .amount { color: #b91c1c; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-button {
      border: none;
      border-radius: 7px;
      padding: 7px 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mini-button.edit { background: #dbeafe; color: #1d4ed8; }
    .mini-button.delete { background: #fee2e2; color: #b91c1c; }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 18px 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: #f8fafc;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 94px;
      background: rgba(15, 23, 42, 0.95);
      color: white;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: 0.25s ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 700px) {
      .filters, .form-grid, .form-grid-2, .summary-box {
        grid-template-columns: 1fr;
      }

      .transaction {
        grid-template-columns: 1fr;
      }

      .transaction .amount {
        text-align: left;
      }

      .header {
        align-items: flex-start;
        gap: 12px;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1>Finance & Loan Master</h1>
        <small id="user-label">முகப்பு</small>
      </div>
      <div class="header-actions">
        <button class="button success" id="export-btn" type="button">CSV</button>
        <button class="button warning" id="backup-btn" type="button">Backup</button>
        <button class="button primary" id="print-btn" type="button">Print</button>
      </div>
    </header>

    <div class="cards-grid">
      <div class="stat-card income">
        <div class="label">மொத்த வரவு</div>
        <div class="value" id="total-income">₹0.00</div>
      </div>
      <div class="stat-card expense">
        <div class="label">மொத்த செலவு</div>
        <div class="value" id="total-expense">₹0.00</div>
      </div>
      <div class="stat-card balance">
        <div class="label">மீதி</div>
        <div class="value" id="net-balance">₹0.00</div>
      </div>
      <div class="stat-card">
        <div class="label">பதிவுகள்</div>
        <div class="value" id="tx-count">0</div>
      </div>
    </div>

    <section class="search-panel">
      <h2>🔎 தேடல் & வடிகட்டி</h2>
      <div class="filters">
        <div class="field-group">
          <label for="search-input">தேடல்</label>
          <input id="search-input" type="text" placeholder="எ.கா: MK, 2000, சிகரெட்" />
        </div>
        <div class="field-group">
          <label for="type-filter">வகை</label>
          <select id="type-filter">
            <option value="ALL">எல்லா பதிவுகளும்</option>
            <option value="income">வரவு</option>
            <option value="expense">செலவு</option>
          </select>
        </div>
        <div class="field-group">
          <label for="period-filter">காலம்</label>
          <select id="period-filter">
            <option value="7d">கடந்த 7 நாட்கள்</option>
            <option value="30d">கடந்த 30 நாட்கள்</option>
            <option value="all">எல்லா பதிவுகள்</option>
            <option value="custom">குறிப்பிட்ட தேதி</option>
          </select>
        </div>
      </div>

      <div class="form-grid-2" id="custom-date-wrap" style="display:none;">
        <div class="field-group">
          <label for="start-date">இருந்து</label>
          <input id="start-date" type="date" />
        </div>
        <div class="field-group">
          <label for="end-date">வரை</label>
          <input id="end-date" type="date" />
        </div>
      </div>

      <div class="summary-box">
        <div class="summary-item summary-income" id="summary-income">வரவு: ₹0.00</div>
        <div class="summary-item summary-expense" id="summary-expense">செலவு: ₹0.00</div>
        <div class="summary-item summary-balance full-width" id="summary-balance">மீதி: ₹0.00</div>
      </div>
    </section>

    <section class="panel">
      <h2>📝 புதிய பதிவு</h2>
      <div class="form-grid">
        <div class="field-group">
          <label for="title">விவரம்</label>
          <input id="title" type="text" placeholder="எ.கா: MK செலவு" />
        </div>
        <div class="field-group">
          <label for="amount">தொகை</label>
          <input id="amount" type="number" min="0" step="0.01" placeholder="₹" />
        </div>
        <div class="field-group">
          <label for="type">வகை</label>
          <select id="type">
            <option value="expense">செலவு (-)</option>
            <option value="income">வரவு (+)</option>
          </select>
        </div>
      </div>

      <div class="form-grid">
        <div class="field-group">
          <label for="source">கணக்கு</label>
          <select id="source">
            <option value="சம்பளம்">சம்பளம்</option>
            <option value="வீடு">வீடு</option>
            <option value="இதர வரவு">இதர வரவு</option>
          </select>
        </div>
        <div class="field-group">
          <label for="category">வகை</label>
          <select id="category">
            <option value="பொது">பொது</option>
            <option value="MK செலவு">MK செலவு</option>
            <option value="SK செலவு">SK செலவு</option>
            <option value="கொல்லை">கொல்லை</option>
          </select>
        </div>
        <div class="field-group">
          <label for="date">தேதி</label>
          <input id="date" type="date" />
        </div>
      </div>

      <button class="button primary full-width" id="save-btn" type="button">+ பதிவு சேர்</button>
    </section>

    <section class="panel">
      <h2>📋 பதிவுகள்</h2>
      <div id="list" class="list"></div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = 'finance_master_safe_v1';
    const DEFAULT_ITEMS = [
      { id: 'demo-1', title: 'Sample Salary', amount: 25000, type: 'income', source: 'சம்பளம்', category: 'பொது', date: new Date().toISOString().slice(0, 10) },
      { id: 'demo-2', title: 'Groceries', amount: 1200, type: 'expense', source: 'வீடு', category: 'MK செலவு', date: new Date().toISOString().slice(0, 10) }
    ];

    const state = {
      items: [],
      editingId: null
    };

    const els = {
      totalIncome: document.getElementById('total-income'),
      totalExpense: document.getElementById('total-expense'),
      netBalance: document.getElementById('net-balance'),
      txCount: document.getElementById('tx-count'),
      summaryIncome: document.getElementById('summary-income'),
      summaryExpense: document.getElementById('summary-expense'),
      summaryBalance: document.getElementById('summary-balance'),
      list: document.getElementById('list'),
      saveBtn: document.getElementById('save-btn'),
      title: document.getElementById('title'),
      amount: document.getElementById('amount'),
      type: document.getElementById('type'),
      source: document.getElementById('source'),
      category: document.getElementById('category'),
      date: document.getElementById('date'),
      search: document.getElementById('search-input'),
      typeFilter: document.getElementById('type-filter'),
      periodFilter: document.getElementById('period-filter'),
      customDateWrap: document.getElementById('custom-date-wrap'),
      startDate: document.getElementById('start-date'),
      endDate: document.getElementById('end-date'),
      userLabel: document.getElementById('user-label'),
      toast: document.getElementById('toast'),
      exportBtn: document.getElementById('export-btn'),
      backupBtn: document.getElementById('backup-btn'),
      printBtn: document.getElementById('print-btn')
    };

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        els.toast.classList.remove('show');
      }, 1800);
    }

    function safeJsonParse(raw, fallback) {
      try {
        const parsed = JSON.parse(raw);
        return parsed ?? fallback;
      } catch (error) {
        return fallback;
      }
    }

    function getTodayString() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(Number(value || 0));
    }

    function sortByDateDesc(items) {
      return [...items].sort((a, b) => {
        const da = new Date(a.date || 0).getTime();
        const db = new Date(b.date || 0).getTime();
        return db - da;
      });
    }

    function loadItems() {
      const raw = localStorage.getItem(STORAGE_KEY);
      const saved = safeJsonParse(raw, DEFAULT_ITEMS);
      const valid = Array.isArray(saved) ? saved : DEFAULT_ITEMS;
      state.items = sortByDateDesc(valid.filter(item => item && typeof item === 'object'));
    }

    function persistItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
    }

    function getFilteredItems() {
      const search = (els.search.value || '').trim().toLowerCase();
      const selectedType = els.typeFilter.value;
      const period = els.periodFilter.value;
      const start = els.startDate.value;
      const end = els.endDate.value;

      const now = new Date();
      const fromDate = new Date(now);

      if (period === '7d') {
        fromDate.setDate(now.getDate() - 7);
      } else if (period === '30d') {
        fromDate.setDate(now.getDate() - 30);
      } else if (period === 'custom') {
        if (start) {
          fromDate.setTime(new Date(start + 'T00:00:00').getTime());
        }
      }

      return state.items.filter(item => {
        const title = (item.title || '').toLowerCase();
        const source = (item.source || '').toLowerCase();
        const category = (item.category || '').toLowerCase();
        const itemDate = new Date(item.date || getTodayString());

        if (search && ![title, source, category, String(item.amount || '')].some(v => v.includes(search))) {
          return false;
        }

        if (selectedType !== 'ALL' && item.type !== selectedType) {
          return false;
        }

        if (period === 'custom') {
          if (start && itemDate < new Date(start + 'T00:00:00')) return false;
          if (end && itemDate > new Date(end + 'T23:59:59')) return false;
        } else if (period === '7d' || period === '30d') {
          if (itemDate < fromDate) return false;
        }

        return true;
      });
    }

    function refreshSummary(items) {
      const income = items.filter(i => i.type === 'income').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const expense = items.filter(i => i.type === 'expense').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const balance = income - expense;

      els.totalIncome.textContent = formatCurrency(income);
      els.totalExpense.textContent = formatCurrency(expense);
      els.netBalance.textContent = formatCurrency(balance);
      els.txCount.textContent = String(items.length);

      els.summaryIncome.textContent = 'வரவு: ' + formatCurrency(income);
      els.summaryExpense.textContent = 'செலவு: ' + formatCurrency(expense);
      els.summaryBalance.textContent = 'மீதி: ' + formatCurrency(balance);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderList() {
      const items = getFilteredItems();
      refreshSummary(state.items);

      if (!items.length) {
        els.list.innerHTML = '<div class="empty-state">No records found.</div>';
        return;
      }

      const html = items.map(item => {
        const amount = Number(item.amount || 0);
        const badge = item.type === 'income' ? 'income' : 'expense';
        return `
          <div class="transaction ${badge}">
            <div class="meta">
              <div class="title">${escapeHtml(item.title || 'Untitled')}</div>
              <div class="subtitle">
                <span>${escapeHtml(item.source || '-')}</span>
                <span>•</span>
                <span>${escapeHtml(item.category || 'பொது')}</span>
                <span>•</span>
                <span>${escapeHtml(item.date || getTodayString())}</span>
              </div>
            </div>
            <div class="amount">${item.type === 'income' ? '+' : '-'}${formatCurrency(amount)}</div>
            <div class="actions">
              <button class="mini-button edit" type="button" data-action="edit" data-id="${item.id}">Edit</button>
              <button class="mini-button delete" type="button" data-action="delete" data-id="${item.id}">Delete</button>
            </div>
          </div>
        `;
      }).join('');

      els.list.innerHTML = html;
    }

    function saveTransaction() {
      const title = (els.title.value || '').trim();
      const amount = Number(els.amount.value || 0);
      const type = els.type.value;
      const source = els.source.value;
      const category = els.category.value;
      const date = els.date.value || getTodayString();

      if (!title) {
        showToast('விவரத்தை உள்ளிடவும்');
        els.title.focus();
        return;
      }

      if (!Number.isFinite(amount) || amount <= 0) {
        showToast('செல்லுபடியாகும் தொகையை உள்ளிடவும்');
        els.amount.focus();
        return;
      }

      const record = {
        id: state.editingId || ('tx-' + Date.now() + '-' + Math.random().toString(16).slice(2)),
        title,
        amount,
        type,
        source,
        category,
        date
      };

      if (state.editingId) {
        state.items = state.items.map(item => item.id === state.editingId ? record : item);
        showToast('பதிவு புதுப்பிக்கப்பட்டது');
      } else {
        state.items.push(record);
        showToast('பதிவு சேர்க்கப்பட்டது');
      }

      state.items = sortByDateDesc(state.items);
      persistItems();
      resetForm();
      renderList();
    }

    function resetForm() {
      state.editingId = null;
      els.title.value = '';
      els.amount.value = '';
      els.type.value = 'expense';
      els.source.value = 'சம்பளம்';
      els.category.value = 'பொத���';
      els.date.value = getTodayString();
      els.saveBtn.textContent = '+ பதிவு சேர்';
    }

    function editTransaction(id) {
      const item = state.items.find(entry => entry.id === id);
      if (!item) return;

      state.editingId = id;
      els.title.value = item.title || '';
      els.amount.value = item.amount || 0;
      els.type.value = item.type || 'expense';
      els.source.value = item.source || 'சம்பளம்';
      els.category.value = item.category || 'பொது';
      els.date.value = item.date || getTodayString();
      els.saveBtn.textContent = '✏️ மாற்றி சேமி';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteTransaction(id) {
      const item = state.items.find(entry => entry.id === id);
      if (!item) return;

      const ok = window.confirm(`"${item.title}" பதிவை நீக்க விரும்புகிறீர்களா?`);
      if (!ok) return;

      state.items = state.items.filter(entry => entry.id !== id);
      persistItems();
      renderList();
      showToast('பதிவு நீக்கப்பட்டது');
    }

    function exportCsv() {
      const rows = [['Title', 'Amount', 'Type', 'Source', 'Category', 'Date']];

      for (const item of state.items) {
        rows.push([
          item.title || '',
          Number(item.amount || 0),
          item.type || '',
          item.source || '',
          item.category || '',
          item.date || ''
        ]);
      }

      const csv = rows.map(row => row.map(value => '"' + String(value).replace(/"/g, '""') + '"').join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = 'finance-export-' + getTodayString() + '.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast('CSV பதிவிறக்கம்');
    }

    function backupJson() {
      const payload = {
        exportedAt: new Date().toISOString(),
        version: 1,
        transactions: state.items
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = 'finance-backup-' + getTodayString() + '.json';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast('Backup downloaded');
    }

    function printStatement() {
      const printWindow = window.open('', '_blank');
      if (!printWindow) {
        showToast('Print blocked by browser');
        return;
      }

      const items = getFilteredItems();
      const income = items.filter(item => item.type === 'income').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const expense = items.filter(item => item.type === 'expense').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const net = income - expense;

      const rows = items.map(item => `
        <tr>
          <td>${escapeHtml(item.title || '')}</td>
          <td>${escapeHtml(item.source || '')}</td>
          <td>${escapeHtml(item.category || '')}</td>
          <td>${escapeHtml(item.date || '')}</td>
          <td>${item.type === 'income' ? '+' : '-'}${formatCurrency(item.amount || 0)}</td>
        </tr>
      `).join('');

      const html = `
        <html>
          <head>
            <title>Finance Statement</title>
            <style>
              body { font-family: Arial, sans-serif; padding: 24px; color: #111827; }
              table { width: 100%; border-collapse: collapse; }
              th, td { border: 1px solid #d1d5db; padding: 8px; text-align: left; font-size: 12px; }
              .header { margin-bottom: 18px; }
              .meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; }
              .value { font-weight: 700; }
            </style>
          </head>
          <body>
            <div class="header">
              <h2>Finance & Loan Master Statement</h2>
              <div class="meta">
                <div>வரவு: <span class="value">${formatCurrency(income)}</span></div>
                <div>செலவு: <span class="value">${formatCurrency(expense)}</span></div>
                <div>மீதி: <span class="value">${formatCurrency(net)}</span></div>
              </div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>விவரம்</th>
                  <th>கணக்கு</th>
                  <th>வகை</th>
                  <th>தேதி</th>
                  <th>தொகை</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </body>
        </html>
      `;

      printWindow.document.write(html);
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    }

    function handleListClick(event) {
      const btn = event.target.closest('[data-action]');
      if (!btn) return;
      const { action, id } = btn.dataset;
      if (action === 'edit') editTransaction(id);
      if (action === 'delete') deleteTransaction(id);
    }

    function onFilterChange() {
      const period = els.periodFilter.value;
      els.customDateWrap.style.display = period === 'custom' ? 'grid' : 'none';
      renderList();
    }

    function bindEvents() {
      els.saveBtn.addEventListener('click', saveTransaction);
      els.search.addEventListener('input', renderList);
      els.typeFilter.addEventListener('change', renderList);
      els.periodFilter.addEventListener('change', onFilterChange);
      els.startDate.addEventListener('change', renderList);
      els.endDate.addEventListener('change', renderList);
      els.list.addEventListener('click', handleListClick);
      els.exportBtn.addEventListener('click', exportCsv);
      els.backupBtn.addEventListener('click', backupJson);
      els.printBtn.addEventListener('click', printStatement);
      els.userLabel.textContent = 'முகப்பு · ' + new Date().toLocaleDateString('ta-IN');
    }

    function init() {
      loadItems();
      els.date.value = getTodayString();
      bindEvents();
      renderList();
    }

    init();
  </script>
</body>
</html>
