<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Finance App</title>
    <link rel="stylesheet" href="style.css">
    <!-- PDF Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- AUTH CONTAINER -->
    <div id="auth-container" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh;">
        <h2>நிதி நிர்வாக ஆப்</h2>
        <button id="login-btn" style="padding:10px 20px; background:#0284c7; color:white; border:none; border-radius:8px; cursor:pointer;">Google உடன் உள்நுழைக</button>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="main-app" style="display:none; padding:15px; max-width:600px; margin:auto;">
        
        <!-- HEADER -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0;">வணக்கம், <span id="user-display-name"></span>!</h3>
            <button id="logout-btn" style="background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">வெளியேறு</button>
        </div>

        <!-- MONTH FILTER -->
        <div style="margin-bottom:15px;">
            <select id="month-filter-select" style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1;">
                <option value="ALL">எல்லா மாதங்களும் (All)</option>
            </select>
        </div>

        <!-- DASHBOARD SUMMARY CARDS -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
            <div style="background:#e0f2fe; padding:10px; border-radius:8px; text-align:center;">
                <small style="color:#0369a1;">சம்பளம் மீதி</small>
                <div id="salary-val" style="font-size:18px; font-weight:bold; color:#0284c7;">₹0</div>
            </div>
            <div style="background:#fef3c7; padding:10px; border-radius:8px; text-align:center;">
                <small style="color:#b45309;">வீட்டு பணம் மீதி</small>
                <div id="home-val" style="font-size:18px; font-weight:bold; color:#d97706;">₹0</div>
            </div>
            <div style="background:#fce7f3; padding:10px; border-radius:8px; text-align:center;">
                <small style="color:#be185d;">கொல்லை செலவு</small>
                <div id="kollai-val" style="font-size:18px; font-weight:bold; color:#db2777;">₹0</div>
            </div>
            <div style="background:#dcfce7; padding:10px; border-radius:8px; text-align:center;">
                <small style="color:#15803d;">MK செலவு</small>
                <div id="mk-val" style="font-size:18px; font-weight:bold; color:#16a34a;">₹0</div>
            </div>
            <div style="background:#f3e8ff; padding:10px; border-radius:8px; text-align:center;">
                <small style="color:#6b21a8;">SK செலவு</small>
                <div id="sk-val" style="font-size:18px; font-weight:bold; color:#9333ea;">₹0</div>
            </div>
            <div style="background:#fee2e2; padding:10px; border-radius:8px; text-align:center;">
                <small style="color:#991b1b;">வட்டி பிசினஸ்</small>
                <div id="vatti-val" style="font-size:18px; font-weight:bold; color:#dc2626;">₹0</div>
            </div>
        </div>

        <!-- SEARCH BOX -->
        <div style="background:#f0f9ff; padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid #bae6fd;">
            <h4 style="margin-top:0; color:#0369a1;">🔍 செலவு / வரவு கணக்கு கேட்க / தேட</h4>
            <div style="display:flex; gap:8px;">
                <input type="text" id="search-query-input" placeholder="எ.கா: சிகரெட், சம்பளம் வரவு, MK செலவு..." style="flex:1; padding:10px; border-radius:8px; border:1px solid #93c5fd;">
                <button onclick="processSearch()" style="background:#0284c7; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer;">தேடு</button>
            </div>
            <div id="search-result-box" style="margin-top:10px;"></div>
        </div>

        <!-- VOICE / TEXT ENTRY -->
        <div style="background:#fff; border:1px solid #e2e8f0; padding:15px; border-radius:12px; margin-bottom:15px;">
            <h4 style="margin-top:0;">🎙️ குரல் / வேகப் பதிவு</h4>
            <div style="display:flex; gap:8px;">
                <input type="text" id="voice-text-input" placeholder="எ.கா: சிகரெட் 110 சம்பளம் பணத்தில்" style="flex:1; padding:10px; border-radius:8px; border:1px solid #cbd5e1;">
                <button onclick="startVoiceRecognition()" style="background:#16a34a; color:white; border:none; padding:10px; border-radius:8px;">🎤</button>
                <button onclick="processVoiceOrText()" style="background:#0284c7; color:white; border:none; padding:10px; border-radius:8px;">சேர்</button>
            </div>
        </div>

        <!-- LISTS & PDF GENERATION AREA -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3 style="margin:0;">அனைத்துப் பதிவுகள்</h3>
            <button onclick="downloadFilteredPDF()" style="background:#059669; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">📄 PDF டவுன்லோட்</button>
        </div>

        <div id="pdf-printable-area">
            <div id="pdf-header-title" style="display:none; text-align:center; margin-bottom:10px;">
                <h2>நிதி அறிக்கை</h2>
                <hr>
            </div>
            <div id="all-list"></div>
        </div>

    </div>

    <!-- SOURCE SELECTION MODAL -->
    <div id="sourceModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:12px; width:80%; max-width:350px; text-align:center;">
            <h4>பண ஆதாரம் எது?</h4>
            <p id="sourceModalText"></p>
            <div style="display:flex; justify-content:space-around; margin-top:15px;">
                <button onclick="confirmSource('சம்பளம்')" style="background:#0284c7; color:white; border:none; padding:10px 15px; border-radius:8px;">சம்பளம்</button>
                <button onclick="confirmSource('வீடு')" style="background:#d97706; color:white; border:none; padding:10px 15px; border-radius:8px;">வீட்டு பணம்</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
