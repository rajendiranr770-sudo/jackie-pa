<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- Header Section -->
    <header class="app-header">
        <h1>செலவு கணக்கு (Expense Tracker)</h1>
    </header>

    <!-- Top Dashboard Overview Cards -->
    <section class="dashboard">
        <div class="card income-card">
            <h3>சம்பளம்</h3>
            <p id="salary-val">₹0</p>
        </div>
        <div class="card home-card">
            <h3>வீடு</h3>
            <p id="home-val">₹0</p>
        </div>
        <div class="card expense-card">
            <h3>கொல்லை</h3>
            <p id="kollai-val">₹0</p>
        </div>
        <div class="card expense-card">
            <h3>MK செலவு</h3>
            <p id="mk-val">₹0</p>
        </div>
        <div class="card expense-card">
            <h3>SK செலவு</h3>
            <p id="sk-val">₹0</p>
        </div>
        <div class="card vatti-card">
            <h3>வட்டி</h3>
            <p id="vatti-val">₹0</p>
        </div>
    </section>

    <!-- Quick Voice / Text Input Form -->
    <section class="input-section">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="எ.கா: சம்பளம் 20000 அல்லது MK செலவு 500...">
            <button onclick="handleManualInput()">சேர்</button>
        </div>
    </section>

    <!-- Transactions List Section -->
    <main class="lists-container">
        <!-- AI Chat / All Transactions -->
        <section class="tab-content">
            <h2>அனைத்து பதிவுகள் (All Logs)</h2>
            <div id="ai-list" class="transaction-list"></div>
        </section>

        <!-- Category Wise Lists -->
        <section class="tab-content">
            <h2>சம்பளம் பற்றிய விவரங்கள்</h2>
            <div id="salary-list" class="transaction-list"></div>
        </section>

        <section class="tab-content">
            <h2>வீட்டுச் செலவு / வரவு</h2>
            <div id="home-list" class="transaction-list"></div>
        </section>

        <section class="tab-content">
            <h2>கொல்லைச் செலவுகள்</h2>
            <div id="kollai-list" class="transaction-list"></div>
        </section>

        <section class="tab-content">
            <h2>MK செலவுகள்</h2>
            <div id="mk-list" class="transaction-list"></div>
        </section>

        <section class="tab-content">
            <h2>SK செலவுகள்</h2>
            <div id="sk-list" class="transaction-list"></div>
        </section>

        <section class="tab-content">
            <h2>வட்டி விவரங்கள்</h2>
            <div id="vatti-list" class="transaction-list"></div>
        </section>
    </main>

    <!-- Input Trigger Handler -->
    <script>
        function handleManualInput() {
            let input = document.getElementById('userInput');
            if (input && input.value.trim() !== '') {
                processNewTransaction(input.value.trim());
                input.value = '';
            }
        }
    </script>

    <!-- App Logic Script File Integration -->
    <script src="app.js"></script>

</body>
</html>
